dir /var/cache/fscache

# Maintain 30% free space minimum
brun 40%    # Stop culling when free space rises above 40%
bcull 35%   # Start culling when free space drops below 35%
bstop 30%   # Stop caching entirely when free space drops below 30%

# Also limit by inode count (files)
frun 40%
fcull 35%
fstop 30%
