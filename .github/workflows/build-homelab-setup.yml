name: Build homelab-setup Binary

on:
  push:
    paths:
      - '.github/workflows/build-homelab-setup.yml'
    branches:
      - main
  schedule:
    # Run daily at 02:00 UTC to check for updates from upstream
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Go Binary from Forked Repo
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout homelab-setup source from forked repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plex-migration-homelab/homelab-setup
          path: homelab-setup-src
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # The release notes hold the upstream commit the published binary was built from
      - name: Check for upstream changes
        id: check
        run: |
          sha=$(git -C homelab-setup-src rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view homelab-setup --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -qx "$sha"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
          cache-dependency-path: homelab-setup-src/homelab-setup/go.sum

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        working-directory: homelab-setup-src/homelab-setup
        run: go test ./... -v

      - name: Build binary
        if: steps.check.outputs.changed == 'true'
        working-directory: homelab-setup-src/homelab-setup
        run: |
          make build
          bin/homelab-setup version
          cd bin && sha256sum homelab-setup > homelab-setup.sha256

      - name: Publish release asset
        if: steps.check.outputs.changed == 'true' && github.event_name != 'pull_request'
        working-directory: homelab-setup-src/homelab-setup/bin
        run: |
          if gh release view homelab-setup --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload homelab-setup homelab-setup homelab-setup.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit homelab-setup --notes "${{ steps.check.outputs.sha }}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create homelab-setup homelab-setup homelab-setup.sha256 --title homelab-setup --notes "${{ steps.check.outputs.sha }}" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
          gh workflow run build.yml --ref main --repo "$GITHUB_REPOSITORY"
